<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="80" y1="40" x2="620" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C96A"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A8872A"/>
    </linearGradient>
    <pattern id="weave" patternUnits="userSpaceOnUse" width="3" height="3">
      <rect width="3" height="3" fill="#D4AF37"/>
      <rect width="1.4" height="1.4" fill="#0B1330" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- particle trail -->
  <g fill="#D4AF37">
    <g opacity="0.85">
      <circle cx="520" cy="70" r="1.8"/><circle cx="540" cy="78" r="1.6"/>
      <circle cx="560" cy="88" r="1.5"/><circle cx="578" cy="100" r="1.3"/>
      <circle cx="595" cy="114" r="1.2"/><circle cx="610" cy="130" r="1.1"/>
      <circle cx="622" cy="148" r="1"/><circle cx="632" cy="168" r="0.9"/>
      <circle cx="640" cy="190" r="0.8"/><circle cx="646" cy="212" r="0.7"/>
    </g>
    <g opacity="0.55">
      <circle cx="530" cy="100" r="1.4"/><circle cx="552" cy="116" r="1.2"/>
      <circle cx="572" cy="134" r="1.1"/><circle cx="590" cy="154" r="1"/>
      <circle cx="606" cy="176" r="0.9"/><circle cx="618" cy="200" r="0.8"/>
      <circle cx="628" cy="224" r="0.7"/><circle cx="636" cy="248" r="0.6"/>
    </g>
    <g opacity="0.35">
      <circle cx="545" cy="145" r="1"/><circle cx="565" cy="168" r="0.9"/>
      <circle cx="582" cy="192" r="0.8"/><circle cx="598" cy="216" r="0.7"/>
      <circle cx="612" cy="240" r="0.6"/><circle cx="624" cy="264" r="0.5"/>
    </g>
  </g>

  <!-- upper wing (spread) -->
  <path fill="url(#gold)" d="M268 168
    C300 96 360 48 430 36
    C470 28 510 42 528 72
    C540 92 532 118 508 132
    C460 156 410 168 358 176
    C330 180 300 178 268 168Z"/>
  <!-- wing bar stripes -->
  <g stroke="#0B1330" stroke-opacity="0.22" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300 120 C340 90 390 72 440 66"/>
    <path d="M292 140 C338 112 392 96 450 92"/>
    <path d="M286 158 C336 134 394 120 458 118"/>
  </g>

  <!-- body -->
  <path fill="url(#gold)" d="M210 200
    C230 168 270 148 320 146
    C370 144 420 156 458 178
    C470 186 474 200 466 212
    C450 236 412 252 370 258
    C330 264 288 258 252 242
    C228 230 212 216 210 200Z"/>

  <!-- lower wing -->
  <path fill="#B8942A" d="M250 228
    C280 236 312 252 334 280
    C348 300 344 322 322 330
    C298 338 270 322 248 292
    C230 268 228 244 250 228Z"/>

  <!-- head -->
  <path fill="url(#gold)" d="M450 168
    C470 148 500 144 522 156
    C540 166 546 186 534 202
    C520 220 492 224 470 212
    C452 202 442 184 450 168Z"/>
  <!-- beak -->
  <path fill="#E8C96A" d="M530 176 L598 198 L530 204 C538 192 538 184 530 176Z"/>
  <!-- eye -->
  <circle cx="500" cy="176" r="4.5" fill="#0B1330"/>
  <circle cx="501.5" cy="174.5" r="1.4" fill="#E8C96A" opacity="0.7"/>

  <!-- tail streamers -->
  <path fill="#D4AF37" d="M218 220
    C170 250 128 300 112 352
    C108 364 120 370 130 360
    C152 340 176 300 204 262
    C214 248 226 230 218 220Z"/>
  <path fill="#B8942A" d="M232 236
    C196 272 166 318 158 360
    C156 370 168 372 176 362
    C192 340 214 300 238 264
    C246 252 244 240 232 236Z"/>

  <!-- weave grain -->
  <g opacity="0.18" stroke="#E8C96A" stroke-width="0.8">
    <path d="M250 190 H430"/><path d="M240 205 H440"/>
    <path d="M255 220 H420"/><path d="M270 235 H400"/>
  </g>
</svg>
